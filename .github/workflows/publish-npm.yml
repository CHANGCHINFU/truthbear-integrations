# npm publish with provenance - one pipeline shared by both packages.
#
# Why this must run in GitHub Actions and not on a laptop:
#   n8n's verification guidelines state that from 2026-05-01 a node submitted for verification
#   must be published from a GitHub Action with a provenance statement; packages published from
#   a local machine are not accepted. Provenance uses GitHub's OIDC, so no long-lived npm token
#   is needed anywhere.
#
# One-time setup (npmjs.com, by the package owner):
#   1. npmjs.com -> the package (or Access -> Trusted publisher)
#   2. Set the trusted publisher to this repository and this workflow file (publish-npm.yml)
#   3. After that this pipeline needs no secrets at all
#
# How to trigger - push a tag:
#   truthbear-ai-sdk-v0.1.0      publishes packages/truthbear-ai-sdk
#   n8n-nodes-truthbear-v0.1.0   publishes packages/n8n-nodes-truthbear
#
# This pipeline deliberately runs the gates BEFORE publishing. An npm version is immutable:
# a mistake stays on the registry forever, so the checks belong in front of the door.
name: publish-npm

on:
  push:
    tags:
      - 'truthbear-ai-sdk-v*'
      - 'n8n-nodes-truthbear-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        required: true
        type: choice
        options:
          - truthbear-ai-sdk
          - n8n-nodes-truthbear

permissions:
  contents: read
  id-token: write        # provenance depends on this; without it npm falls back to a long-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Resolve the target once, so the tag and the input cannot disagree later in the job.
      - name: Resolve package
        id: pick
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            PKG="${{ inputs.package }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PKG="${TAG%-v*}"
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "Publishing: $PKG"

      # Gate A: every generated file must still match the source of truth.
      # Hand-editing anything under generated/ turns this red.
      - name: Gate A - generated files match the source of truth
        run: node scripts/gen.mjs --check

      # Gate B: no price literal anywhere; URLs and on-chain addresses only in the source of
      # truth and in generated files.
      - name: Gate B - literals
        run: node scripts/lint-no-literals.mjs

      # Gate D: nothing that must not become public. Publishing cannot be undone.
      - name: Gate D - public preflight
        run: node scripts/preflight-public.mjs

      - name: Install and build
        working-directory: packages/${{ steps.pick.outputs.pkg }}
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Package contract tests
        working-directory: packages/${{ steps.pick.outputs.pkg }}
        run: npm test --if-present

      # The tag and package.json must agree, or the registry would carry a version whose name
      # says one thing and whose contents say another - and that cannot be withdrawn.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/${{ steps.pick.outputs.pkg }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WANT="${TAG##*-v}"
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "Tag says $WANT but package.json says $HAVE - refusing to publish"
            exit 1
          fi
          echo "Version matches: $HAVE"

      # Trusted publishing only. No secret is involved and none may be reintroduced.
      #
      # ★2026-08-20, why the NODE_AUTH_TOKEN fallback was removed rather than left in place:
      #   while both a trusted publisher AND a token are configured, a misconfigured trusted
      #   publisher does not fail - npm quietly falls back to the token and the job goes green.
      #   The pipeline would then be reporting "publishing works" while proving nothing about
      #   the path it is supposed to be using. That is exactly the false-green this project
      #   keeps getting caught by. With the token gone, a broken OIDC setup turns the job red.
      #
      # The bootstrap token that published the first release of each package is revoked; a
      # package cannot have a trusted publisher until it exists, so the first release had to
      # use one. npm's migration guidance is: token first, verify, then revoke.
      #
      # Publishing from a laptop is deliberately not an option here: this account carries a
      # security key and no authenticator app, so npm demands an interactive step-up that a
      # non-interactive shell cannot satisfy.
      - name: Publish
        working-directory: packages/${{ steps.pick.outputs.pkg }}
        run: npm publish --access public

      # ★A publish that succeeded is not the same thing as a publish that carried provenance,
      #   and the difference is not cosmetic: n8n's verification guidelines require a node to be
      #   published from a GitHub Action WITH a provenance statement. The first releases of both
      #   packages went out green and carried none (dist.attestations was null) - nothing in this
      #   pipeline noticed. So the claim is checked here instead of assumed.
      #   The registry needs a moment to expose the attestation, hence the retries.
      - name: Provenance actually attached
        working-directory: packages/${{ steps.pick.outputs.pkg }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5 6; do
            ATT="$(npm view "$NAME@$VER" dist.attestations --json 2>/dev/null || echo null)"
            if [ -n "$ATT" ] && [ "$ATT" != "null" ] && [ "$ATT" != '""' ]; then
              echo "Provenance present for $NAME@$VER:"
              echo "$ATT"
              exit 0
            fi
            echo "attempt $i: no attestation visible yet, waiting"
            sleep 10
          done
          echo "Published $NAME@$VER but the registry reports no provenance attestation."
          echo "That version cannot pass n8n verification. Treating as a failure."
          exit 1
